version: 2

formats: all

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx converts the example notebooks with pandoc
    - pandoc
  jobs:
    post_create_environment:
      # Install uv
      # https://docs.astral.sh/uv/getting-started/installation/
      - python -m pip install --disable-pip-version-check "uv==0.11.32"
    post_install:
      # Install the locked default and development dependencies (the dev group
      # provides sphinx/nbsphinx). UV_PROJECT_ENVIRONMENT points uv at the
      # virtualenv Read the Docs created for this build.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked


sphinx:
  configuration: docs/source/conf.py
