variables:
  POETRY_HOME: "$CI_PROJECT_DIR/.poetry"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"

test:compass-modules:
  script:
    - set +e
    - has_failed=false
    - module purge
    - module load pleque/${COMPASS_MODULE}
    - module list
    - cd $PLEQUE_PATH
    - pwd
    - echo $CI_PROJECT_DIR
    - pytest tests/test_cdb.py --junitxml=${CI_PROJECT_DIR}/report.xml | tee ${CI_PROJECT_DIR}/report.txt
    - if [ $? -ne 0 ]; then has_failed=true; fi
    - sleep 5
    - if [ "$has_failed" = true ]; then exit 1; fi
  artifacts:
    when: on_failure
    paths:
      - ${CI_PROJECT_DIR}/report.txt
    reports:
      junit: ${CI_PROJECT_DIR}/report.xml

  tags:
    - soroban-node-01
  parallel:
    matrix:
      - COMPASS_MODULE: master
      - COMPASS_MODULE: develop
      - COMPASS_MODULE: unstable
      - COMPASS_MODULE: sumtraic

test:pytest:
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - export PATH="$POETRY_HOME/bin:$PATH"
    - poetry config virtualenvs.create false
    - poetry install --without compass --with omas
    - pytest
  cache:
    paths:
      - .poetry
      - .cache/pypoetry
  image: python:3.9