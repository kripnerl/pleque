#image: python:3.9
image: python:3.10

variables:
  POETRY_HOME: "$CI_PROJECT_DIR/.poetry"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"

cache:
  paths:
    - .poetry
    - .cache/pypoetry

before_script:
  - curl -sSL https://install.python-poetry.org | python3 -
  - export PATH="$POETRY_HOME/bin:$PATH"
  - poetry config virtualenvs.create false
  - poetry install --without compass # --with omas # omas is temporarily skipped due to the complicated dependencies

test:pytest:
  script:
    - pytest --junitxml=report.xml --cov=pleque --cov-report=xml:coverage.xml --cov-report=term-missing
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - report.xml
      - coverage.xml
    expire_in: 1 week
    - pytest

lint:ruff:
  stage: test
  script:
    - pip install ruff
    - ruff check pleque/ tests/
  needs: ["test:pytest"]

typecheck:ty:
  stage: test
  script:
    - pip install ty
    - ty check pleque/
  needs: ["test:pytest"]
  allow_failure: true  # ty is new; don't block pipeline until annotations are complete
