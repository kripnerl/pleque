image: python:3.10

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

cache:
  paths:
    - .uv-cache

before_script:
  - python -m pip install --disable-pip-version-check "uv==0.11.32"
  - uv sync --locked

test:pytest:
  script:
    - uv run pytest --junitxml=report.xml --cov=pleque --cov-report=xml:coverage.xml --cov-report=term-missing
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - report.xml
      - coverage.xml
    expire_in: 1 week

lint:ruff:
  script:
    - uv run ruff check pleque/ tests/
  needs: ["test:pytest"]

typecheck:ty:
  script:
    - uv run ty check pleque/
  needs: ["test:pytest"]
  allow_failure: true

build:package:
  script:
    - uv build

docs:html:
  script:
    - uv run make -C docs html
