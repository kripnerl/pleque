variables:
  POETRY_HOME: "$CI_PROJECT_DIR/.poetry"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"



test:compass-modules:
  script:
    - module purge
    - module load pleque/${COMPASS_MODULE}
    - cd $PLEQUE_PATH
    - pwd
    - pytest tests/test_cdb.py

  tags:
    - soroban-node-01
  parallel:
    matrix:
      - COMPASS_MODULE: master
      - COMPASS_MODULE: develop
      - COMPASS_MODULE: unstable
      - COMPASS_MODULE: sumtraic2023

test:pytest:
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - export PATH="$POETRY_HOME/bin:$PATH"
    - poetry config virtualenvs.create false
    - poetry install --without compass --with omas
    - pytest
  cache:
    paths:
      - .poetry
      - .cache/pypoetry
  image: python:3.9