[tool.poetry]
name = "pleque"
version = "0.1.0b0"
description = "PLEQUE is a Python module allowing simple visualisation and manipulation of tokamak plasma equilibria."
authors = ["Lukaáš Kripner <kripner@ipp.cas.cz>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kripnerl/pleque"
documentation = ""

[tool.poetry.dependencies]
python = ">=3.9, <3.11"
xarray = "^2023.3.0"
pandas = "^1.5.3"
shapely = "^1.8.5"
netcdf4 = "^1.6.3"
h5py = "^3.8.0"
scikit-image = "^0.20.0"
omas = {version = "^0.91.0", optional = false}
matplotlib = {version = "^3.7.1", optional = false}

[tool.poetry.group.dev.dependencies]
nbsphinx-link = "^1.3.0"
pytest = "^7.2.2"
pylint = "^2.17.1"
flake8 = "^6.0.0"
setuptools = "^67.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
